<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Dub</title>
<style>
  :root { color-scheme: dark; --bg: #0a0d1c; --card: #141a33; --line: #2a3360; --text: #eef0fa; --soft: #9aa3cc; --cyan: #4fe3ff; --red: #ff5a5a; --gold: #ffc23d }
  * { box-sizing: border-box }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 Inter, system-ui, sans-serif }
  main { display: grid; grid-template-columns: minmax(220px, 34vh) minmax(0, 1fr); gap: 24px; max-width: 1200px; margin: auto; padding: 20px; align-items: start }
  #left { position: sticky; top: 20px }
  video { width: 100%; border-radius: 10px; background: #000; display: block }
  #cue { min-height: 76px; padding: 10px 0 }
  #cue b { font-size: 19px; display: block }
  #bar { height: 10px; background: var(--line); border-radius: 5px; overflow: hidden }
  #bar i { display: block; height: 100%; width: 0; background: var(--gold) }
  #bar.rec i { background: var(--red) }
  #status { color: var(--soft); min-height: 1.4em }
  #status.bad { color: var(--red) }
  h2 { font-size: 15px; margin: 0 0 8px; color: var(--soft); font-weight: 500 }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 12px }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px }
  .who { color: var(--gold); text-transform: capitalize }
  .text { font-size: 17px }
  .tag { font-size: 13px; color: var(--soft) }
  .tag.ok { color: var(--cyan) }
  button, select { font: inherit; color: var(--text); background: #1d2548; border: 1px solid var(--line); border-radius: 7px; padding: 6px 11px; cursor: pointer }
  button:hover:not(:disabled) { border-color: var(--cyan) }
  button:disabled { opacity: .4; cursor: default }
  button.rec { border-color: var(--red) }
  :focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px }
  select { max-width: 320px }
  code { background: #0006; padding: 2px 6px; border-radius: 5px; overflow-wrap: anywhere }
  @media (max-width: 700px) { main { grid-template-columns: 1fr } #left { position: static } }
</style>
<main>
  <div id="left">
    <video id="video" src="/video" preload="auto" muted playsinline></video>
    <div id="cue"><b id="cueText"></b><span id="cueTime" class="tag"></span></div>
    <div id="bar"><i></i></div>
    <div class="row"><button id="all">Play with my takes</button><button id="stop">Stop (Space)</button><button id="cal">Calibrate</button></div>
    <p id="status" role="status"></p>
  </div>
  <div>
    <section><h2>Voices. Wear headphones: the microphone must not hear the video.</h2><div id="cast"></div></section>
    <div id="lines"></div>
    <section><h2>When the takes are right, make the video again:</h2><code id="command"></code></section>
  </div>
</main>
<script>
const $ = id => document.getElementById(id), video = $('video')
const PRE = 2.5, EARLY = .4, LATE = 2.5  // seconds: run-up before a line, recording before and after it
let S, voices = [], job = null, context, speakers, mic, track, busy = false
const players = {}  // line -> AudioBuffer of its take

const say = (text, bad) => { $('status').textContent = text; $('status').className = bad ? 'bad' : '' }
async function call(path, body) {
  const r = await fetch(path, body === undefined ? {} : { method: 'POST', body, headers: { 'X-Dub': '1' } })
  const answer = await r.json()
  if (!r.ok) throw new Error(answer.error)
  return answer
}
async function guard(work) {
  if (busy) return
  busy = true; draw()
  try { await work() } catch (e) { say(e.message, true) }
  busy = false; draw()
}
async function refresh() { S = await call('/state'); draw() }
const audio = () => context ??= new AudioContext()
const out = () => speakers ??= (() => { const g = audio().createGain(); g.connect(audio().destination); return g })()
async function buffer(n) {
  const url = `/take/${n}${S.lines[n].done ? '?done=1' : ''}`
  return players[n] ??= await audio().decodeAudioData(await (await fetch(url)).arrayBuffer())
}
async function soundtrack() {
  return track ??= await audio().decodeAudioData(await (await fetch('/sound')).arrayBuffer())
}

// Play from a to b with the given takes in place of the soundtrack. One clock, the AudioContext's, for the soundtrack,
// the takes and the microphone; the muted video follows it. `at` is the moment that reaches the ears and the eyes.
async function play(a, b, ns, onTick, mute = []) {
  stop()
  a = Math.max(0, a)
  const ctx = audio()
  await ctx.resume()
  const sound = await soundtrack(), takes = []
  for (const n of ns) takes.push([S.lines[n], await buffer(n)])
  video.pause(); video.currentTime = a
  const me = job = { sources: [], start: ctx.currentTime + .15 - a }
  const silent = [...mute, ...takes.map(([l, t]) => [Math.min(l.start, l.take.at), Math.max(l.end, l.take.at + t.duration)])]
  const gain = ctx.createGain()
  gain.connect(out())
  for (const [x, y] of silent) {
    gain.gain.setValueAtTime(0, Math.max(0, me.start + x))
    gain.gain.setValueAtTime(1, Math.max(0, me.start + y))
  }
  const add = (buf, at, out) => {
    const source = ctx.createBufferSource()
    source.buffer = buf; source.connect(out)
    source.start(me.start + Math.max(a, at), Math.max(0, a - at))
    me.sources.push(source)
  }
  add(sound, 0, gain)
  for (const [l, t] of takes) add(t, l.take.at, out())
  return new Promise(done => {
    me.done = done
    const tick = () => {
      if (job !== me) return
      const t = me.now = ctx.currentTime - me.start - (ctx.outputLatency || 0)
      if (t >= a && video.paused && t < video.duration) video.play().catch(() => {})
      if (t >= a && Math.abs(video.currentTime - t) > .12 && !video.seeking) video.currentTime = t
      cue(Math.max(a, t))
      onTick?.(t)
      if (t >= b) stop(); else requestAnimationFrame(tick)
    }
    tick()
  })
}
function stop() {
  const me = job
  if (!me) return
  job = null
  video.pause()
  me.sources.forEach(s => { try { s.stop() } catch {} })
  me.done?.()
}
let target = null  // the line being recorded
function cue(t) {
  const n = target ?? S.lines.findIndex(l => t < l.end)
  const l = S.lines[n]
  if (!l) return
  $('cueText').textContent = l.text
  const wait = l.start - t
  $('cueTime').textContent = wait > 0 ? `${l.who} in ${wait.toFixed(1)} s` : `${l.who}: now`
  $('bar').className = target !== null && wait <= 0 ? 'rec' : ''
  $('bar').firstElementChild.style.width = 100 * (wait > 0 ? Math.max(0, 1 - wait / PRE) : Math.min(1, -wait / (l.end - l.start))) + '%'
}

// The microphone as blocks of samples, each with its time on the clock of the AudioContext.
// MediaRecorder is not used: it starts up to 0.25 s late, by an unknown amount.
const TAP = URL.createObjectURL(new Blob([`registerProcessor('tap', class extends AudioWorkletProcessor {
  process([[x]]) { if (x) this.port.postMessage([currentTime, x.slice()]); return true }
})`], { type: 'text/javascript' }))
async function microphone() {
  if (mic) return mic
  const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false, channelCount: 1 } })
  await audio().audioWorklet.addModule(TAP)
  const source = audio().createMediaStreamSource(stream), tap = new AudioWorkletNode(audio(), 'tap')
  source.connect(tap).connect(audio().destination)  // its output is silent; without it no block comes
  return mic = { source, port: tap.port, late: stream.getAudioTracks()[0].getSettings().latency ?? 0 }
}
function wav(blocks, rate) {
  const n = blocks.reduce((sum, b) => sum + b.length, 0), v = new DataView(new ArrayBuffer(44 + 2 * n))
  const text = (at, s) => [...s].forEach((c, i) => v.setUint8(at + i, c.charCodeAt(0)))
  text(0, 'RIFF'); v.setUint32(4, 36 + 2 * n, true); text(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true)
  v.setUint32(24, rate, true); v.setUint32(28, 2 * rate, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); text(36, 'data'); v.setUint32(40, 2 * n, true)
  let at = 44
  for (const b of blocks) for (const x of b) { v.setInt16(at, Math.max(-1, Math.min(1, x)) * 32767, true); at += 2 }
  return new Blob([v], { type: 'audio/wav' })
}
// From a sound in the ears to the same sound in the samples: measured by Calibrate, else what the browser believes.
function delay(m) {
  let saved = null
  try { saved = localStorage.getItem('delay') } catch {}
  return saved === null ? (audio().outputLatency || 0) + m.late : +saved
}
async function calibrate() {
  stop()
  await audio().resume()
  const m = await microphone(), rate = audio().sampleRate, blocks = []
  let first = null
  m.port.onmessage = ({ data: [time, block] }) => { first ??= time; blocks.push(block) }
  say('Calibrating: hold the headphones against the microphone…')
  const clicks = [1, 1.6, 2.2, 2.8, 3.4].map(d => audio().currentTime + d)
  for (const at of clicks) {
    const o = audio().createOscillator()
    o.frequency.value = 1500; o.connect(out()); o.start(at); o.stop(at + .03)
  }
  await new Promise(done => setTimeout(done, 4600))
  m.port.onmessage = null
  const x = blocks.flatMap(b => [...b]), peak = x.reduce((p, v) => Math.max(p, Math.abs(v)), 0)
  const found = clicks.map(at => {
    const i = Math.round((at - first) * rate), k = x.slice(i, i + rate * .5).findIndex(v => Math.abs(v) > peak * .4)
    return k < 0 ? Infinity : k / rate
  }).sort((p, q) => p - q)
  if (peak < .01 || found[4] - found[0] > .03) throw new Error('The clicks were not heard clearly. Headphones against the microphone, volume up, then again.')
  try { localStorage.setItem('delay', found[2]) } catch {}
  say(`Calibrated: ${Math.round(found[2] * 1000)} ms.`)
}
async function record(n) {
  const l = S.lines[n], m = await microphone(), blocks = [], from = l.start - EARLY, to = l.end + LATE
  let at = null
  m.port.onmessage = ({ data: [time, block] }) => {
    if (!job) return
    const t = time - job.start - delay(m)  // when it was spoken, on the clock of the video
    if (t < from) return
    at ??= t; blocks.push(block)
  }
  target = n
  say('Speak when the bar is red; Space when you have finished.')
  try {
    await play(l.start - PRE, to, [], null, [[from, to]])
  } finally { target = null; m.port.onmessage = null }
  if (!blocks.length) return say('Nothing recorded.')
  await call(`/take/${n}?at=${Math.max(0, at).toFixed(3)}`, wav(blocks, audio().sampleRate))
  delete players[n]
  await refresh()
  say('Recorded. Here it is in place:')
  await listen(n)
}
async function listen(n) {
  const l = S.lines[n], b = await buffer(n)
  await play(Math.min(l.start, l.take.at) - 1, Math.max(l.end, l.take.at + b.duration) + .3, [n])
}
async function shift(n, by) {
  const at = Math.max(0, S.lines[n].take.at + by)
  await call(`/at/${n}?at=${at.toFixed(3)}`, '')
  await refresh()
  await listen(n)
}
async function convert(n) {
  const who = S.lines[n].who, voice = S.choices[who]
  if (!voice) throw new Error(`Choose a voice for ${who} first.`)
  say(`Converting "${S.lines[n].text}"…`)
  await call(`/convert/${n}?voice=${voice}`, '')
  delete players[n]
  await refresh()
  say('Converted.')
}

function make(tag, props, ...kids) { const e = Object.assign(document.createElement(tag), props); e.append(...kids); return e }
function draw() {
  if (!S) return
  document.title = `Dub ${S.name}`
  $('command').textContent = S.command
  $('all').disabled = $('cal').disabled = busy
  const cast = [...new Set(S.lines.map(l => l.who))]
  $('cast').replaceChildren(...cast.map(who => {
    const pick = make('select', { ariaLabel: `Voice of ${who}`, disabled: busy, onchange: () => guard(async () => {
      if (pick.value) S.choices[who] = pick.value; else delete S.choices[who]
      await call('/choices', JSON.stringify(S.choices))
    }) }, new Option('Choose…', ''), new Option('My own voice (no conversion)', 'own'),
      ...voices.map(v => new Option([v.name, v.labels?.gender, v.labels?.age, v.labels?.accent].filter(Boolean).join(', '), v.voice_id)))
    const now = S.choices[who] ?? ''
    if (now && ![...pick.options].some(o => o.value === now)) pick.add(new Option(now, now))
    pick.value = now
    const sample = voices.find(v => v.voice_id === now)?.preview_url
    return make('div', { className: 'row' }, make('span', { className: 'who', textContent: who }), pick,
      make('button', { textContent: 'Hear', disabled: !sample, onclick: () => new Audio(sample).play() }))
  }))
  if (!S.key) $('cast').append(make('p', { className: 'tag', textContent: 'ELEVENLABS_API_KEY is not set: add it to .env, then restart.' }))
  $('lines').replaceChildren(...S.lines.map((l, n) => {
    const button = (textContent, work, off, className = '') => make('button', { textContent, className, disabled: busy || off, onclick: () => guard(work) })
    const no = !l.take
    return make('section', {}, make('div', {}, make('span', { className: 'who', textContent: l.who + ' ' }), make('span', { className: 'text', textContent: l.text })),
      make('div', { className: 'row' }, button(no ? 'Record' : 'Record again', () => record(n), false, 'rec'), button('Listen', () => listen(n), no),
        button('−100', () => shift(n, -.1), no), button('−20', () => shift(n, -.02), no), button('+20', () => shift(n, .02), no), button('+100 ms', () => shift(n, .1), no),
        button('Convert', () => convert(n), no), button('Drop', async () => { if (!confirm('Delete this take?')) return; await call(`/drop/${n}`, ''); delete players[n]; await refresh() }, no),
        make('span', { className: 'tag' + (l.done ? ' ok' : ''), textContent: no ? 'original voice' : l.done ? `converted, at ${l.take.at.toFixed(2)} s` : `not converted yet, at ${l.take.at.toFixed(2)} s` })))
  }))
}
$('all').onclick = () => guard(() => play(0, video.duration, S.lines.map((l, n) => n).filter(n => S.lines[n].take)))
$('stop').onclick = stop
$('cal').onclick = () => guard(calibrate)
addEventListener('keydown', e => { if (e.code === 'Space' && job) { e.preventDefault(); stop() } })
refresh().then(async () => {
  if (!S.key) return
  voices = await call('/voices'); draw()
}).catch(e => say(e.message, true))
</script>
</html>
